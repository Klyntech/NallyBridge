[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nally-bridge"
version = "0.1.0"
description = "Lightweight remote execution agent for NALLY — connects your device to NALLY via WebSocket."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Clinton", email = "clinton@klyntech.com"},
]
keywords = ["nally", "ai", "bridge", "remote", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
service = ["pywin32>=306"]
build = ["pyinstaller>=6.0"]
dev = ["pytest", "ruff"]

[project.scripts]
nally-bridge = "nally_bridge.cli:main"

[project.urls]
Repository = "https://github.com/klyntech/nally-bridge"

[tool.setuptools.packages.find]
include = ["nally_bridge*"]

[tool.ruff]
line-length = 120
target-version = "py310"
